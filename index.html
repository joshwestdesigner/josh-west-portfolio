<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Josh West</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

#frame { position: fixed; inset: 0; background-size: cover; background-position: center; background-repeat: no-repeat; }

.jw-logo { position: fixed; top: 28px; left: 50%; transform: translateX(-50%); z-index: 10; }
.jw-logo img { height: 32px; width: auto; display: block; }

.jw-skip { position: fixed; bottom: 32px; right: 32px; z-index: 10; font-family: 'Inter', sans-serif; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.35); text-decoration: none; transition: color 0.2s; }
.jw-skip:hover { color: #fff; }
</style>
</head>
<body>

<div id="frame"></div>

<div class="jw-logo">
  <img src="https://raw.githubusercontent.com/joshwestdesigner/josh-west-portfolio/main/logo.png" alt="Josh West">
</div>

<a href="work.html" class="jw-skip">Skip</a>

<script>
var images = [
  'https://raw.githubusercontent.com/joshwestdesigner/josh-west-portfolio/refs/heads/Images---e-for-education/eforeducationthumbnail.jpg',
  'https://raw.githubusercontent.com/joshwestdesigner/josh-west-portfolio/main/images/heat-rdy-beckham-kv_cropped2.png',
  'https://raw.githubusercontent.com/joshwestdesigner/josh-west-portfolio/refs/heads/Images---e-for-education/phantomfrapp_thumbnail.jpeg',
  'https://raw.githubusercontent.com/joshwestdesigner/josh-west-portfolio/main/images/cop26-7.png',
  'https://raw.githubusercontent.com/joshwestdesigner/josh-west-portfolio/refs/heads/Images---e-for-education/paralympicpins_thumbnail.jpg',
  'https://raw.githubusercontent.com/joshwestdesigner/josh-west-portfolio/refs/heads/Images---e-for-education/forgetmenot_thumbnail.jpeg',
  'https://raw.githubusercontent.com/joshwestdesigner/josh-west-portfolio/refs/heads/Images---e-for-education/originalsource_thumbnail.jpg',
  'https://raw.githubusercontent.com/joshwestdesigner/josh-west-portfolio/main/images/teamwear-team.png',
  'https://raw.githubusercontent.com/joshwestdesigner/josh-west-portfolio/main/images/cop26-5.png',
  'https://raw.githubusercontent.com/joshwestdesigner/josh-west-portfolio/main/images/cop26-6.png',
  'https://raw.githubusercontent.com/joshwestdesigner/josh-west-portfolio/main/images/cop26-9.png',
  'https://raw.githubusercontent.com/joshwestdesigner/josh-west-portfolio/main/images/cinch-truck-insitu.png',
];

var frame = document.getElementById('frame');
var started = false;

// Preload all images then start
var loaded = 0;
images.forEach(function(src) {
  var img = new Image();
  img.onload = img.onerror = function() {
    loaded++;
    if (loaded === images.length) runSequence();
  };
  img.src = src;
});

// Fallback: start after 1.5s even if not all loaded
setTimeout(function() { runSequence(); }, 1500);

function runSequence() {
  if (started) return;
  started = true;

  var i = 0;
  frame.style.backgroundImage = 'url(' + images[0] + ')';

  var t = setInterval(function() {
    i++;
    if (i >= images.length) {
      clearInterval(t);
      frame.style.backgroundImage = 'none';
      setTimeout(function() { window.location.href = 'work.html'; }, 600);
      return;
    }
    frame.style.backgroundImage = 'url(' + images[i] + ')';
  }, 250);
}
</script>

</body>
</html>
